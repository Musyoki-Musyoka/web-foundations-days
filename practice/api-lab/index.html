<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes API Lab</title>
    <script src="app.js" defer></script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        max-width: 700px;
        margin: 32px auto;
        padding: 0 20px;
        background: #f2f5f3;
        color: #223b33;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      h1 {
        margin-bottom: 8px;
        line-height: 1.2;
      }

      .api-hint {
        color: #53675d;
        font-size: 0.9rem;
      }

      section {
        margin-top: 24px;
        padding: 20px;
        border: 1px solid #cedbd3;
        border-radius: 8px;
        background: #ffffff;
      }

      h2 {
        margin-top: 0;
        font-size: 1.25rem;
      }

      button,
      input {
        min-height: 44px;
        padding: 10px 14px;
        border-radius: 6px;
        font: inherit;
      }

      button {
        border: 1px solid #145c49;
        background: #145c49;
        color: #ffffff;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: #0b4535;
      }

      button:disabled,
      input:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
      }

      input {
        display: block;
        width: 100%;
        margin-bottom: 12px;
        border: 1px solid #9daf9f;
      }

      button:focus-visible,
      input:focus-visible {
        outline: 3px solid #145c49;
        outline-offset: 3px;
      }

      #status {
        min-height: 1.6em;
      }

      #notes-list {
        padding: 0;
        list-style: none;
      }

      #notes-list li {
        padding-block: 10px;
        border-bottom: 1px solid #cedbd3;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>QuickNotes API Lab</h1>
      <p class="api-hint">JSONPlaceholder is a practice API. Created notes are simulated, not permanently saved.</p>
    </header>

    <main>
      <section aria-labelledby="load-heading">
        <h2 id="load-heading">Notes from the server</h2>
        <button id="load-btn" type="button">Load notes from server</button>
        <p id="status" role="status" aria-live="polite"></p>
        <ul id="notes-list"></ul>
      </section>

      <section aria-labelledby="create-heading">
        <h2 id="create-heading">Create a note</h2>
        <form id="note-form">
          <label for="title-input">Title</label>
          <input id="title-input" name="title" type="text" autocomplete="off">
          <button type="submit">Send to server</button>
        </form>
      </section>
    </main>
  </body>
</html>
